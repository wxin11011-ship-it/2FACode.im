site:
  name: 2FACode.im
  site: 'https://2facode.im'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: '' # Google Search Console 验证码

metadata:
  title:
    default: 2FACode.im
    template: '%s — 2FACode.im'
  description: 'Private, browser-only 2FA and TOTP code generation for one secret or a batch.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 2FACode.im
    type: website
    images:
      - url: 'https://2facode.im/images/2facode-og.png'
        width: 1200
        height: 630
        alt: '2FACode.im — private browser-based 2FA code generator'

# 国际化配置（可选）
i18n:
  language: en
  textDirection: ltr

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
